# Server Control dashboard — indra.thatinsaneguy.com
# FastAPI serves the UI (/), status/action API (/api/*) on one upstream.
# Upstream port **9282** (DASHBOARD_PORT / deploy.sh); deploy.sh rewrites if you change it.
# After install: sudo certbot --nginx -d indra.thatinsaneguy.com
#
# This dashboard can restart/stop services — protect it. Enable HTTP Basic auth
# (DASH_USER/DASH_PASS in ecosystem.config.cjs) and/or restrict by IP below.

server {
    listen 80;
    listen [::]:80;
    server_name indra.thatinsaneguy.com;

    client_max_body_size 10m;

    # Optional: LAN-only. Uncomment to restrict to your local network.
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:9282;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;   # long deploy/rebuild jobs
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

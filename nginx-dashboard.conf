# Server Dashboard reverse proxy.
# Suggested domain: dash.thatinsaneguy.com  (or serve LAN-only, see README).
#
#   sudo cp ~/Desktop/serverDashboard/nginx-dashboard.conf \
#       /etc/nginx/sites-available/dash.thatinsaneguy.com
#   sudo ln -sf /etc/nginx/sites-available/dash.thatinsaneguy.com \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dash.thatinsaneguy.com
#
# IMPORTANT: this UI can restart/stop your services. Keep DASH_USER/DASH_PASS
# set (HTTP Basic in the app) AND/OR restrict by IP below.

server {
    listen 80;
    server_name dash.thatinsaneguy.com;

    # Optional: LAN-only. Uncomment to restrict to your local network.
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:9282;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # long deploy/rebuild jobs
    }
}

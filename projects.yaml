# Indra project registry — edit this to add/remove projects.
# Derived from ~/Desktop/PORTS.md + safety audit (2026-07-16).
#
# Per project:
#   name      : display name
#   category  : web-app | self-hosted | lan-device | infra
#   pm2       : list of PM2 process names (managed as your user, no sudo)
#   docker    :
#     dir              : compose directory
#     env_file         : optional; passed as `docker compose --env-file` (for ${VAR} mounts)
#     containers       : docker ps names (status pills)
#     compose_services : compose service names used by start/stop/restart/rebuild/logs
#                        REQUIRED for start/rebuild (refuses unscoped `up`)
#   rebuild   : extra shell commands after docker (e.g. Next.js npm build + PM2)
#   ports     : list of { port, label } checked on 127.0.0.1
#   domains   : list of https URLs to health-check (HTTP status)
#   deploy    : { script, sudo, safe, args? }
#               Deploy button only shows when safe: true
#   git_repos : list of repo paths to `git pull --ff-only` (Pull button)
#               e.g. Apeksha is one repo (frontend + backend in the same tree)
#   notes     : optional string

projects:
  - id: indra
    name: Indra
    category: web-app
    git_repos: [~/Desktop/Indra]
    pm2: [indra]
    pm2_bootstrap: ~/Desktop/Indra/deploy.sh
    ports:
      - { port: 9282, label: ui }
    domains:
      - https://indra.thatinsaneguy.com
    deploy: { script: ~/Desktop/Indra/deploy.sh, sudo: true, safe: false }
    notes: This dashboard — Pull, then Rebuild to update.

  - id: apeksha
    name: Apeksha
    category: web-app
    git_repos: [~/Desktop/Apeksha]
    pm2: [apeksha-frontend]
    docker:
      dir: ~/Desktop/Apeksha/backend/deploy
      env_file: ~/Desktop/Apeksha/backend/.env
      containers: [bhasini-translation-api]
      compose_services: [bhasini-api]
    rebuild:
      - SKIP_NGINX=1 bash ~/Desktop/Apeksha/frontend/deploy.sh --skip-nginx
    ports:
      - { port: 9200, label: frontend }
      - { port: 9201, label: api }
    domains:
      - https://apeksha.thatinsaneguy.com
      - https://apekshaapi.thatinsaneguy.com
    # Full nginx/SSL deploy — use from a terminal: sudo bash ~/Desktop/Apeksha/deploy.sh
    deploy: { script: ~/Desktop/Apeksha/deploy.sh, sudo: true, safe: false }

  - id: habittracker
    name: Habit Tracker
    category: web-app
    git_repos: [~/Desktop/habitTracker]
    pm2: [habittracker]
    ports:
      - { port: 9210, label: api }
    domains:
      - https://habit.thatinsaneguy.com
    deploy: { script: ~/Desktop/habitTracker/backend/deploy.sh, sudo: true, safe: false }


  - id: nextcloud
    name: Nextcloud
    category: self-hosted
    git_repos: [~/Desktop/selfHosted]
    docker:
      dir: ~/Desktop/selfHosted/nextcloud
      containers: [nextcloud, nextcloud-redis, nextcloud-db]
      compose_services: [nextcloud, nextcloud-redis, nextcloud-db]
    ports:
      - { port: 9270, label: web }
    domains:
      - https://kloud.thatinsaneguy.com
    deploy: { script: ~/Desktop/selfHosted/nextcloud/deploy.sh, sudo: true, safe: false }

  - id: immich
    name: Immich
    category: self-hosted
    git_repos: [~/Desktop/selfHosted]
    docker:
      dir: ~/Desktop/selfHosted/immich
      containers: [immich-server, immich-postgres, immich-machine-learning, immich-redis]
      compose_services: [immich-server, immich-database, immich-machine-learning, immich-redis]
    ports:
      - { port: 2283, label: web }
    domains:
      - https://photos.thatinsaneguy.com
    deploy: { script: ~/Desktop/selfHosted/immich/deploy.sh, sudo: true, safe: false }

  - id: jellyfin
    name: Jellyfin
    category: self-hosted
    git_repos: [~/Desktop/selfHosted]
    docker:
      dir: ~/Desktop/selfHosted/jellyfin
      containers: [jellyfin]
      compose_services: [jellyfin]
    ports:
      - { port: 8096, label: web }
    domains:
      - https://streaming.thatinsaneguy.com
    deploy: { script: ~/Desktop/selfHosted/jellyfin/deploy.sh, sudo: true, safe: false }
    notes: May need the NVIDIA runtime for transcoding.

  - id: sunshine
    name: Sunshine (Moonlight host)
    category: self-hosted
    ports:
      - { port: 40000, label: moonlight }
      - { port: 40001, label: web-ui }
    domains:
      - https://tpilot.thatinsaneguy.com
    deploy: { script: ~/Desktop/sunshine/deploy.sh, sudo: true, safe: false }
    notes: Web UI at tpilot (401 = up, 502 = Sunshine down). Start/stop/status - bash ~/Desktop/sunshine/deploy.sh start|stop|status

  - id: octopi
    name: OctoPi (LAN)
    category: lan-device
    domains:
      - https://bramha.thatinsaneguy.com
    notes: LAN 3D printer — monitor only.

# Infra services checked for status (no per-project deploy button).
#   control: true adds Start / Restart / Stop buttons for the systemd unit. Needs the
#   passwordless rule: sudo bash ~/Desktop/dktp/installIndraSudoers.sh
infra:
  - id: nginx
    name: nginx
    systemd: nginx
    ports:
      - { port: 80, label: http }
      - { port: 443, label: https }
  - id: docker
    name: Docker Engine
    systemd: docker
  - id: transmission
    name: Transmission
    systemd: transmission-daemon
    control: true
    ports:
      - { port: 9091, label: rpc }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>Indra</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/static/indra.css?v=4" />
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <a class="brand" href="/" title="Indra">
    <img src="/static/brand/indra.png?v=1" alt="" />
    <span><b>Indra</b><small>Operations console</small></span>
  </a>
  <label class="search" title="Search (/)">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search apps, containers, ports, domains…" autocomplete="off" spellcheck="false" aria-label="Search" />
    <kbd>/</kbd>
  </label>
  <div class="top-right">
    <button class="live on" id="liveBtn" type="button" title="Auto-refresh every 10 seconds. Click to pause.">
      <i class="led"></i><span id="liveText">Live</span>
    </button>
    <button class="btn icon" id="refreshBtn" type="button" title="Refresh now (R)" aria-label="Refresh">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    </button>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section class="hero first" id="hero">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </section>
  <nav class="tabs" id="tabs" aria-label="Filter"></nav>
  <div id="sections">
    <div class="section"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
  </div>
  <div class="no-results" id="noResults" hidden></div>
</main>

<div class="dock" id="dock" aria-label="Running jobs"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Job console: build / deploy / pull output and logs -->
<div class="scrim" id="conScrim" hidden>
  <section class="console" id="console" role="dialog" aria-modal="true" aria-labelledby="conTitle">
    <header class="con-head">
      <span id="conBadge"></span>
      <div class="con-title"><h2 id="conTitle">Job</h2><p id="conSub"></p></div>
      <span class="status-pill" id="conStatus"></span>
      <button class="btn icon ghost" id="conMax" type="button" title="Expand" aria-label="Expand"></button>
      <button class="btn icon ghost" id="conClose" type="button" title="Close (Esc)" aria-label="Close"></button>
    </header>
    <div class="con-tools">
      <label class="con-search">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        <input id="conQ" type="search" placeholder="Filter lines…" autocomplete="off" spellcheck="false" aria-label="Filter lines" />
        <span class="hits" id="conHits"></span>
      </label>
      <div class="con-logs" id="conLogTools" hidden>
        <select id="conCount" aria-label="Lines">
          <option value="120">Last 120 lines</option>
          <option value="500">Last 500 lines</option>
          <option value="1000">Last 1000 lines</option>
          <option value="2000">Last 2000 lines</option>
        </select>
        <button class="btn" id="conReload" type="button"></button>
        <button class="tog" id="conTail" type="button" aria-pressed="false" title="Reload the logs every 5 seconds"><i class="led"></i>Live tail</button>
      </div>
      <span class="grow"></span>
      <button class="tog" id="conWrap" type="button" aria-pressed="true" title="Wrap long lines"></button>
      <button class="tog" id="conFollow" type="button" aria-pressed="true" title="Keep scrolled to the newest output"></button>
      <button class="btn icon" id="conCopy" type="button" title="Copy output" aria-label="Copy output"></button>
      <button class="btn icon" id="conDl" type="button" title="Download as .log" aria-label="Download"></button>
    </div>
    <div class="con-body">
      <div class="con-out" id="conOut"></div>
      <div class="con-empty" id="conEmpty" hidden><div class="bars"><i></i><i></i><i></i><i></i></div><span>Waiting for output…</span></div>
      <button class="btn primary sm jump" id="conJump" type="button" hidden></button>
    </div>
    <footer class="con-foot">
      <div class="meta" id="conMeta"></div>
      <span class="grow"></span>
      <button class="btn" id="conHide" type="button">Close</button>
    </footer>
  </section>
</div>

<!-- Confirm popup -->
<div class="scrim" id="dlgScrim" hidden>
  <div class="dialog primary" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-icon" id="dlgIcon"></div>
    <h2 id="dlgTitle"></h2>
    <div class="dlg-body" id="dlgBody"></div>
    <label class="dlg-pw" id="dlgPwWrap" hidden>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="dlgPw" placeholder="sudo password (optional — used once, never stored)" autocomplete="off" />
    </label>
    <div class="dlg-actions">
      <span class="dlg-note" id="dlgNote"></span>
      <button class="btn lg" id="dlgCancel" type="button">Cancel</button>
      <button class="btn lg primary" id="dlgOk" type="button">Confirm</button>
    </div>
  </div>
</div>

<script src="/static/simpleIcons.js?v=1"></script>
<script src="/static/indra.js?v=4"></script>
</body>
</html>
